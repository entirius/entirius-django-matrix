[project]
name = "entirius-django-matrix"
version = "4.0.0"
description = "Storefront read model for Django: a denormalized product/catalog projection with faceted search, pricing and stock"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "pydantic>=2.0",
    "drf-spectacular>=0.27",
    "marshmallow",
    "marshmallow-dataclass[enum, union]",
    "celery",
    "entirius-django-utils>=2.0.0",
    "entirius-django-pim>=3.0.0",
    "entirius-django-regional>=2.0.0",
    "entirius-py-magento2-sdk2>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]"]
# Soft integrations — imported lazily (try/except or feature-flag) with graceful degradation.
qms          = ["entirius-django-qms>=4.0.0"]          # stock read from QMS when django_checkout absent
pricemanager = ["entirius-django-pricemanager>=4.0.0"]  # price read model (fill worker degrades gracefully)
pricetuner   = ["entirius-django-pricetuner>=2.0.0", "entirius-django-accounts>=5.0.0"]  # customer-group pricing behind USE_PRICE_TUNER_IN_MATRIX

[project.urls]
Repository = "https://github.com/entirius/entirius-django-matrix"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_matrix"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "F841"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_matrix/models/**" = ["DJ001", "S324"]
"src/django_matrix/repository/**" = ["B904", "B905", "F401", "S608", "S610", "W291"]
"src/django_matrix/workers/**" = ["B007", "B904", "B905", "E731", "F401"]
"src/django_matrix/views/**" = ["B904", "E722", "E731"]
"src/django_matrix/utils/**" = ["B007", "B904", "E731"]
"src/django_matrix/dto/view/**" = ["B026", "E721", "F401", "F403"]
"src/django_matrix/tasks.py" = ["E402"]
"src/django_matrix/urls.py" = ["E721"]

[tool.ruff.lint.isort]
known-first-party = ["django_matrix"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# Soft, lazily imported (try/except with graceful degradation) integrations, not runtime dependencies —
# the read model works without them; the host service provides them when present:
#   django_checkout — stock signal/model, QMS fallback + TYPE_CHECKING hints (Etap 5, unreleased)
#   django_omnibus  — omnibus price lookup, returns None when absent (Etap 5, unreleased)
#   django_reviews  — product average-rating fill, returns None when absent (co-released fala 4;
#                     promote to a [reviews] extra once both are on PyPI — tracked in the debt register)
DEP001 = ["django_checkout", "django_omnibus", "django_reviews"]
