[project]
name = "entirius-django-matrix"
version = "4.5.0rc1"
description = "Storefront read model for Entirius: a denormalized catalog projection with faceted search, prices and stock"
keywords = ["django", "ecommerce", "entirius", "storefront", "read-model", "catalog", "search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski" },
    { name = "Paweł Kiełt" },
    { name = "Mateusz Baran" },
    { name = "Michał Kloczkowski" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "pydantic>=2.0",
    "drf-spectacular>=0.27",
    "marshmallow",
    # no [enum, union] extras — they don't exist in marshmallow-dataclass 8.x (features in base)
    "marshmallow-dataclass",
    "celery",
    "entirius-django-utils>=2.0.0",
    "entirius-django-pim>=3.1.0",
    "entirius-django-regional>=2.0.0",
    "entirius-py-magento2-sdk2>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]"]
# Soft integrations — imported lazily (try/except or feature-flag) with graceful degradation.
qms          = ["entirius-django-qms>=4.0.0"]          # stock read from QMS when django_checkout absent
pricemanager = ["entirius-django-pricemanager>=4.1.0"]  # price read model (fill worker degrades gracefully)
checkout     = ["entirius-django-checkout>=9.0.0"]     # stock signal/model, QMS fallback + TYPE_CHECKING hints
omnibus      = ["entirius-django-omnibus>=3.0.0"]      # omnibus price lookup, returns None when absent
reviews      = ["entirius-django-reviews>=2.0.0"]      # product average-rating fill, returns None when absent

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-matrix/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-matrix"
Changelog = "https://github.com/entirius/entirius-django-matrix/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-matrix/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_matrix"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "F841"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_matrix/models/**" = ["DJ001", "S324"]
"src/django_matrix/repository/**" = ["B904", "B905", "F401", "S608", "S610", "W291"]
"src/django_matrix/workers/**" = ["B007", "B904", "B905", "E731", "F401"]
"src/django_matrix/views/**" = ["B904", "E722", "E731"]
"src/django_matrix/utils/**" = ["B007", "B904", "E731"]
"src/django_matrix/dto/view/**" = ["B026", "E721", "F401", "F403"]
"src/django_matrix/tasks.py" = ["E402"]
"src/django_matrix/urls.py" = ["E721"]

[tool.ruff.lint.isort]
known-first-party = ["django_matrix"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
